services:
  keylight:
    build: .
    restart: unless-stopped
    env_file:
      - ${KEYLIGHT_ENV_FILE:-.env.production}
    environment:
      FINDER_DB_PATH: /data/findings.db
      FINDER_HOST: 0.0.0.0
      FINDER_PORT: "8765"
      PORT: "8765"
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      KEYLIGHT_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      KEYLIGHT_REQUIRE_AUTH: "1"
      KEYLIGHT_TRUST_PROXY: "1"
    secrets:
      - github_token
      - admin_password
    volumes:
      - keylight_data:/data
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${KEYLIGHT_ENV_FILE:-.env.production}
    depends_on:
      keylight:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

secrets:
  github_token:
    file: ./secrets/github_token
  admin_password:
    file: ./secrets/admin_password

volumes:
  keylight_data:
  caddy_data:
  caddy_config:
